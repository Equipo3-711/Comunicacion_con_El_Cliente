<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitar cotización · T Efficiency</title>
  <link rel="icon" href="../img/icono.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <div class="w">
    <header class="top" id="encabezado"></header>
    <main class="card formulario">
      <form id="formulario" novalidate>
        <h2>Solicitar cotización</h2>
        <div class="g g2">
          <div>
            <label for="cliente">Cliente <i>*</i></label>
            <input class="in" id="cliente" readonly>
          </div>
          <div>
            <label for="correo">Correo <i>*</i></label>
            <input class="in" id="correo" readonly>
          </div>
        </div>
        <label for="telefono">Teléfono <i>*</i> (puedes corregirlo)</label>
        <input class="in" id="telefono" name="telefono" type="tel" autocomplete="tel">
        <p class="er" data-error="telefono"></p>

        <fieldset class="ch">
          <legend>Tipo de cliente <i>*</i></legend>
          <label><input type="radio" name="tipoCliente" value="particular"><span>Particular</span></label>
          <label><input type="radio" name="tipoCliente" value="constructora"><span>Constructora</span></label>
          <label><input type="radio" name="tipoCliente" value="arquitecto"><span>Arquitecto</span></label>
          <label><input type="radio" name="tipoCliente" value="otro"><span>Otro</span></label>
        </fieldset>
        <p class="er" data-error="tipoCliente"></p>

        <fieldset class="ch">
          <legend>Tipo de trabajo <i>*</i></legend>
          <label><input type="radio" name="tipoTrabajo" value="ventanas"><span>Ventanas</span></label>
          <label><input type="radio" name="tipoTrabajo" value="fachada"><span>Fachada</span></label>
          <label><input type="radio" name="tipoTrabajo" value="canceles"><span>Canceles</span></label>
          <label><input type="radio" name="tipoTrabajo" value="barandales"><span>Barandales</span></label>
        </fieldset>
        <p class="er" data-error="tipoTrabajo"></p>

        <label for="direccion">Dirección de la obra <i>*</i> (calle, número, colonia y ciudad)</label>
        <input class="in" id="direccion" name="direccion" autocomplete="street-address" placeholder="Calle Roble 12, Col. Centro, León">
        <p class="er" data-error="direccion"></p>

        <label for="medidas">Medidas aproximadas (opcional)</label>
        <input class="in" id="medidas" name="medidas" placeholder="Ej. 3 ventanas de 1.20 × 1.50 m">
        <p class="er" data-error="medidas"></p>

        <label for="descripcion">Descripción <i>*</i></label>
        <textarea class="in" id="descripcion" name="descripcion" placeholder="Barandal de vidrio para escalera, 4 m lineales."></textarea>
        <p class="er" data-error="descripcion"></p>

        <label class="up" id="zona">
          Fotos o planos (opcional): arrastra imágenes o PDF aquí, o elígelos. Hasta 5 archivos de 10 MB.
          <input type="file" id="archivos" name="archivos" multiple accept="image/jpeg,image/png,image/webp,application/pdf">
          <ul id="elegidos"></ul>
        </label>

        <p class="er general" data-error="general" role="alert"></p>
        <div class="g g2">
          <a class="btn" href="proyectos.html">Cancelar</a>
          <button class="btn p" type="submit">Enviar cotización</button>
        </div>
      </form>
    </main>
  </div>
  <script type="module" src="../js/paginas/cotizacion.js"></script>
</body>
</html>
