<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitudes · T Efficiency</title>
  <link rel="icon" href="../img/icono.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <div class="w">
    <header class="top" id="encabezado"></header>
    <main id="contenido">
      <p><a href="inicio.html">← Mis clientes</a></p>
      <div class="row" style="margin-bottom:16px">
        <h1 class="pagina" style="margin:0">Solicitudes</h1>
        <button class="btn p auto" id="registrar" type="button">＋ Registrar solicitud</button>
      </div>

      <section class="card">
        <form class="filtros" id="filtros">
          <label>Estado <select class="in" name="estado"></select></label>
          <label>Categoría <select class="in" name="categoria"></select></label>
          <label>Canal <select class="in" name="canal"></select></label>
          <label>Responsable
            <select class="in" name="responsable">
              <option value="">Todos</option>
              <option value="yo">Mías</option>
              <option value="sin_asignar">Sin asignar</option>
            </select>
          </label>
        </form>
        <p class="suave" id="resumen"></p>
        <div id="lista"><p class="vacio">Cargando…</p></div>
      </section>
    </main>
  </div>

  <!-- Registrar lo que llegó por WhatsApp, una llamada, redes sociales, correo o en persona (RF-01, RNF-01). -->
  <dialog id="dialogoRegistrar" aria-labelledby="tituloRegistrar">
    <form id="formRegistrar" novalidate>
      <div class="row"><h2 id="tituloRegistrar" style="margin:0">Registrar solicitud</h2>
        <button class="btn s" type="button" id="cerrarDialogo">Cerrar</button></div>

      <fieldset class="ch mt" id="canales">
        <legend>¿Por dónde llegó? <i>*</i></legend>
      </fieldset>
      <p class="er" data-error="canal"></p>

      <label for="categoria">¿De qué se trata? <i>*</i></label>
      <select class="in" id="categoria" name="categoria"></select>
      <p class="er" data-error="categoria"></p>

      <fieldset class="ch">
        <legend>¿Quién la pide?</legend>
        <label><input type="radio" name="quien" value="cliente" checked><span>Cliente registrado</span></label>
        <label><input type="radio" name="quien" value="contacto"><span>Alguien sin cuenta</span></label>
      </fieldset>

      <div data-quien="cliente" class="g g2">
        <div><label for="clienteId">Cliente</label>
          <select class="in" id="clienteId" name="clienteId"></select>
          <p class="er" data-error="clienteId"></p></div>
        <div><label for="proyectoId">Proyecto (opcional)</label>
          <select class="in" id="proyectoId" name="proyectoId"></select>
          <p class="er" data-error="proyectoId"></p></div>
      </div>
      <div data-quien="contacto" class="g g2" hidden>
        <div><label for="contactoNombre">Nombre</label>
          <input class="in" id="contactoNombre" name="contactoNombre" autocomplete="off">
          <p class="er" data-error="contactoNombre"></p></div>
        <div><label for="contactoTelefono">Teléfono (opcional)</label>
          <input class="in" id="contactoTelefono" name="contactoTelefono" type="tel" autocomplete="off">
          <p class="er" data-error="contactoTelefono"></p></div>
      </div>

      <label for="descripcion">¿Qué pidió? <i>*</i></label>
      <textarea class="in" id="descripcion" name="descripcion" placeholder="Pregunta si hacen canceles de baño templados."></textarea>
      <p class="er" data-error="descripcion"></p>

      <label for="responsableId">Responsable</label>
      <select class="in" id="responsableId" name="responsableId"></select>
      <p class="er" data-error="responsableId"></p>

      <p class="er general" data-error="general" role="alert"></p>
      <button class="btn p" type="submit">Guardar solicitud</button>
    </form>
  </dialog>

  <script type="module" src="../js/paginas/arquitecto-solicitudes.js"></script>
</body>
</html>
