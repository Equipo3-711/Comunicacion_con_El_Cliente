<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyecto · T Efficiency</title>
  <link rel="icon" href="../img/icono.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <div class="w">
    <header class="top" id="encabezado"></header>
    <main id="contenido">
      <div class="row" style="margin-bottom:12px;flex-wrap:wrap">
        <div>
          <small class="suave" id="empresa"></small>
          <h1 class="pagina" id="nombre">Cargando…</h1>
          <span class="tag" id="estado"></span>
        </div>
        <button class="btn y s" id="registrar" type="button" aria-expanded="false">Registrar actualización</button>
      </div>

      <form class="card" id="formActualizacion" style="margin-bottom:16px" hidden novalidate>
        <h3>Nueva actualización</h3>
        <fieldset class="ch mt">
          <legend>Tipo</legend>
          <label><input type="radio" name="tipo" value="avance" checked><span>Avance</span></label>
          <label><input type="radio" name="tipo" value="cambio_estado"><span>Cambio de estado</span></label>
          <label><input type="radio" name="tipo" value="documento"><span>Documento</span></label>
          <label><input type="radio" name="tipo" value="solicitud"><span>Solicitud</span></label>
        </fieldset>

        <div data-para="avance solicitud">
          <label for="descripcion">Descripción</label>
          <textarea class="in" id="descripcion" name="descripcion" maxlength="500" placeholder="Se instalaron 2 de 3 ventanas."></textarea>
          <p class="er" data-error="descripcion"></p>
          <label class="up">Fotos (opcional): hasta 5 imágenes JPG, PNG o WEBP.
            <input type="file" name="fotos" multiple accept="image/jpeg,image/png,image/webp">
          </label>
        </div>

        <div data-para="cambio_estado" hidden>
          <label for="nuevoEstado">Nuevo estado</label>
          <select class="in" id="nuevoEstado" name="estado"></select>
          <p class="er" data-error="estado"></p>
        </div>

        <div data-para="documento" hidden>
          <label for="nombreDocumento">Nombre del documento</label>
          <input class="in" id="nombreDocumento" name="nombre" placeholder="Contrato, ficha técnica, garantía…">
          <label class="up">Archivo PDF o imagen
            <input type="file" name="archivo" accept="application/pdf,image/jpeg,image/png,image/webp">
          </label>
        </div>

        <p class="nota" id="automatico"></p>
        <p class="er general" data-error="general" role="alert"></p>
        <button class="btn p" type="submit">Guardar</button>
      </form>

      <div class="g g2" style="align-items:start">
        <section class="card">
          <h2>Actividades</h2>
          <div id="actividades"></div>
          <form class="escribir mt" id="formActividad">
            <label for="nuevaActividad" hidden>Nueva actividad</label>
            <input class="in" id="nuevaActividad" name="descripcion" maxlength="255" placeholder="Nueva actividad, p. ej. Instalación">
            <button class="btn s" type="submit">Agregar</button>
          </form>
          <p class="nota">Al marcarla aparece sola en el historial del cliente, sin escribirle un mensaje.</p>
        </section>

        <section class="card">
          <h2>Datos del proyecto</h2>
          <form id="formDatos" novalidate>
            <div class="g g2">
              <div><label for="presupuesto">Presupuesto (MXN)</label>
                <input class="in" id="presupuesto" name="presupuesto" type="number" min="0" step="0.01">
                <p class="er" data-error="presupuesto"></p></div>
              <div><label for="pagado">Pagos realizados (MXN)</label>
                <input class="in" id="pagado" name="pagado" type="number" min="0" step="0.01">
                <p class="er" data-error="pagado"></p></div>
            </div>
            <label for="garantiaHasta">Garantía hasta</label>
            <input class="in" id="garantiaHasta" name="garantiaHasta" type="date">
            <p class="er" data-error="garantiaHasta"></p>
            <label for="notasInternas">Notas internas (el cliente no las ve)</label>
            <textarea class="in" id="notasInternas" name="notasInternas" maxlength="2000"></textarea>
            <p class="er general" data-error="general" role="alert"></p>
            <button class="btn" type="submit">Guardar datos</button>
          </form>
        </section>
      </div>

      <div class="row mt" style="flex-wrap:wrap">
        <a href="inicio.html">Volver</a>
        <a id="abrirChat" href="#">Abrir chat</a>
        <a id="verComoCliente" href="#">Ver historial del cliente →</a>
      </div>
    </main>
  </div>
  <script type="module" src="../js/paginas/arquitecto-proyecto.js"></script>
</body>
</html>
