<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat con el cliente · T Efficiency</title>
  <link rel="icon" href="../img/icono.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <div class="w">
    <header class="top" id="encabezado"></header>
    <main class="g dos-uno" id="contenido">
      <section class="card">
        <div class="row">
          <div class="row inicio">
            <span class="av" id="iniciales"></span>
            <div><h3 id="cliente">Cargando…</h3><small class="suave" id="proyecto"></small></div>
          </div>
          <a id="detalles" href="#">Detalles del proyecto</a>
        </div>
        <div id="chat"></div>
      </section>
      <section class="card g" style="align-content:start">
        <h3>Estado</h3>
        <div class="g" id="estados" role="group" aria-label="Estado de atención">
          <button class="btn" type="button" data-atencion="no_atendido" aria-pressed="false"><span class="dot no_atendido"></span> No atendido</button>
          <button class="btn" type="button" data-atencion="pendiente" aria-pressed="false"><span class="dot pendiente"></span> Pendiente</button>
          <button class="btn" type="button" data-atencion="atendido" aria-pressed="false"><span class="dot atendido"></span> Atendido</button>
        </div>
        <p class="nota">Cambia solo: una duda nueva lo deja en «No atendido» y tu respuesta, en «Pendiente». Márcalo como «Atendido» cuando la duda quede resuelta.</p>
      </section>
    </main>
  </div>
  <script type="module" src="../js/paginas/arquitecto-chat.js"></script>
</body>
</html>
