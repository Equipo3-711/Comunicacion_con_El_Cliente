<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis clientes · T Efficiency</title>
  <link rel="icon" href="../img/icono.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <div class="w">
    <header class="top" id="encabezado"></header>
    <main id="contenido">
      <div class="g dos-uno">
        <section class="card">
          <div class="row">
            <h2>Mis clientes</h2>
            <label class="filtro"><input type="checkbox" id="soloDudas"> Solo con dudas</label>
          </div>
          <div id="clientes"><p class="vacio">Cargando…</p></div>
          <p class="ttl leyenda">
            <span><span class="dot no_atendido"></span>No atendido</span>
            <span><span class="dot pendiente"></span>Pendiente</span>
            <span><span class="dot atendido"></span>Atendido</span>
          </p>
        </section>
        <div class="g">
          <button class="gi" id="agregar" type="button"><h3>Agregar usuario</h3><p>Asigna un cliente a tu cartera</p></button>
          <button class="gi" id="dudas" type="button"><h3>Dudas y preguntas</h3><p>Chat con los clientes</p><b id="numDudas" hidden></b></button>
        </div>
      </div>

      <section class="card mt" id="cotizaciones">
        <h2>Cotizaciones recibidas</h2>
        <div id="listaCotizaciones"><p class="vacio">Cargando…</p></div>
      </section>
    </main>
  </div>

  <dialog id="dialogoAgregar" aria-labelledby="tituloAgregar">
    <form id="formAgregar" novalidate>
      <div class="row"><h2 id="tituloAgregar" style="margin:0">Agregar usuario</h2>
        <button class="btn s" type="button" id="cerrarDialogo">Cerrar</button></div>
      <fieldset class="ch mt">
        <legend>¿El cliente ya tiene cuenta?</legend>
        <label><input type="radio" name="modo" value="nuevo" checked><span>Cliente nuevo</span></label>
        <label><input type="radio" name="modo" value="registrado"><span>Cliente ya registrado</span></label>
      </fieldset>

      <div data-modo="nuevo">
        <div class="g g2">
          <div><label for="nombre">Nombre de contacto <i>*</i></label><input class="in" id="nombre" name="nombre">
            <p class="er" data-error="nombre"></p></div>
          <div><label for="empresa">Empresa <i>*</i></label><input class="in" id="empresa" name="empresa">
            <p class="er" data-error="empresa"></p></div>
          <div><label for="correoCliente">Correo <i>*</i></label><input class="in" id="correoCliente" name="correo" type="email">
            <p class="er" data-error="correo"></p></div>
          <div><label for="telefonoCliente">Teléfono <i>*</i></label><input class="in" id="telefonoCliente" name="telefono" type="tel">
            <p class="er" data-error="telefono"></p></div>
        </div>
        <label for="contrasenaInicial">Contraseña inicial <i>*</i> (compártela con el cliente; mínimo 8 caracteres)</label>
        <input class="in" id="contrasenaInicial" name="contrasena" type="password" autocomplete="new-password">
        <p class="er" data-error="contrasena"></p>
      </div>

      <div data-modo="registrado" hidden>
        <label for="empresaId">Empresa del cliente <i>*</i></label>
        <select class="in" id="empresaId" name="empresaId"></select>
        <p class="er" data-error="empresaId"></p>
      </div>

      <div class="g g2">
        <div><label for="nombreProyecto">Nombre de la obra <i>*</i></label>
          <input class="in" id="nombreProyecto" name="nombreProyecto" placeholder="Ventanas · Calle Roble 12">
          <p class="er" data-error="nombreProyecto"></p></div>
        <div><label for="tipoTrabajo">Tipo de trabajo <i>*</i></label>
          <select class="in" id="tipoTrabajo" name="tipoTrabajo">
            <option value="">Elige…</option>
            <option value="ventanas">Ventanas</option>
            <option value="fachada">Fachada</option>
            <option value="canceles">Canceles</option>
            <option value="barandales">Barandales</option>
          </select>
          <p class="er" data-error="tipoTrabajo"></p></div>
      </div>
      <p class="er general" data-error="general" role="alert"></p>
      <button class="btn p" type="submit">Agregar a mi cartera</button>
    </form>
  </dialog>

  <script type="module" src="../js/paginas/arquitecto-inicio.js"></script>
</body>
</html>
