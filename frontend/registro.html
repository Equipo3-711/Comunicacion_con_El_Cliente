<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · T Efficiency</title>
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="w">
    <header class="top" id="encabezado"></header>
    <main class="card angosta">
      <form id="formulario" novalidate>
        <h2>Crear cuenta</h2>
        <p class="suave">Necesitas una cuenta para solicitar una cotización y seguir tus proyectos.</p>
        <label for="nombre">Nombre de contacto <i>*</i></label>
        <input class="in" id="nombre" name="nombre" autocomplete="name" placeholder="Ana López">
        <p class="er" data-error="nombre"></p>
        <label for="empresa">Empresa <i>*</i> (si eres particular, escribe tu nombre)</label>
        <input class="in" id="empresa" name="empresa" autocomplete="organization" placeholder="Constructora Roble">
        <p class="er" data-error="empresa"></p>
        <label for="correo">Correo <i>*</i></label>
        <input class="in" id="correo" name="correo" type="email" autocomplete="email" placeholder="ana@roble.com">
        <p class="er" data-error="correo"></p>
        <label for="telefono">Teléfono <i>*</i></label>
        <input class="in" id="telefono" name="telefono" type="tel" autocomplete="tel" placeholder="477 123 4567">
        <p class="er" data-error="telefono"></p>
        <div class="g g2">
          <div>
            <label for="contrasena">Contraseña <i>*</i></label>
            <input class="in" id="contrasena" name="contrasena" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
            <p class="er" data-error="contrasena"></p>
          </div>
          <div>
            <label for="confirmarContrasena">Confirmar contraseña <i>*</i></label>
            <input class="in" id="confirmarContrasena" name="confirmarContrasena" type="password" autocomplete="new-password">
            <p class="er" data-error="confirmarContrasena"></p>
          </div>
        </div>
        <p class="er general" data-error="general" role="alert"></p>
        <button class="btn p" type="submit">Crear cuenta</button>
        <p class="centro"><a href="index.html">Ya tengo cuenta</a></p>
      </form>
    </main>
  </div>
  <script type="module" src="js/paginas/registro.js"></script>
</body>
</html>
