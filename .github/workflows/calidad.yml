name: Calidad

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas y análisis estático
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Linter
        run: npm run lint
      - name: Pruebas con cobertura
        run: npm run cobertura

  web:
    name: Aplicación web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Linter
        run: npm run lint
      - name: Tipos de TypeScript
        run: npm run tipos
      - name: Pruebas unitarias
        run: npm test
      - name: Build
        run: npm run build
      - name: Flujos completos con Cypress
        run: |
          npm run dev &
          for intento in $(seq 1 30); do curl -sf http://localhost:5173/ > /dev/null && break; sleep 1; done
          npm run e2e

  seguridad:
    name: Dependencias y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Dependencias con vulnerabilidades (API)
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Dependencias con vulnerabilidades (aplicación web)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Llaves y contraseñas en el código y el historial
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
