name: Calidad

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas y análisis estático
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      # Linter: lo agrega Grecia (T-21).
      - name: Pruebas con cobertura
        run: npm run cobertura


  seguridad:
    name: Dependencias y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Dependencias con vulnerabilidades
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Llaves y contraseñas en el código y el historial
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
